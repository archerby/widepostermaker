<section class="hero">
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1>{{H1}}</h1>
  <p class="hero-lead">{{LEAD}}</p>
</section>

<section id="poster-app" class="tool-card" aria-label="Poster tiling workspace">
  <div id="empty-state">
    <div id="dropzone" class="dropzone">
      <p class="dropzone-title">{{UI_DROP_TITLE}}</p>
      <p class="dropzone-sub">{{UI_DROP_SUB}}</p>
      <div class="dropzone-actions">
        <label class="btn btn-primary" for="file-input">{{UI_CHOOSE_FILE}}</label>
        <input id="file-input" class="file-input-hidden" type="file" accept="image/*,.pdf,application/pdf">
        <button id="btn-sample" class="btn btn-secondary" type="button">{{UI_TRY_SAMPLE}}</button>
      </div>
    </div>
  </div>

  <div id="workspace" hidden>
    <div class="workspace-grid">
      <div class="preview-pane">
        <div class="preview-toolbar">
          <button id="btn-change-file" class="btn btn-secondary btn-sm" type="button">{{UI_CHANGE_FILE}}</button>
          <div id="pdf-page-controls" class="pdf-page-controls" hidden>
            <button id="btn-prev-page" class="btn btn-secondary btn-sm" type="button">{{UI_PREV_PAGE}}</button>
            <span id="pdf-page-label">Page 1 / 1</span>
            <button id="btn-next-page" class="btn btn-secondary btn-sm" type="button">{{UI_NEXT_PAGE}}</button>
          </div>
        </div>
        <div class="preview-stage">
          <canvas id="preview-canvas"></canvas>
        </div>
        <p id="preview-caption" class="preview-caption"></p>
      </div>

      <div class="controls-pane">
        <div class="control-row">
          <div class="field">
            <label for="paper-select">{{UI_PAPER_LABEL}}</label>
            <select id="paper-select">
              <option value="a4">A4 (210 × 297 mm)</option>
              <option value="letter">US Letter (8.5 × 11 in)</option>
              <option value="a3">A3 (297 × 420 mm)</option>
              <option value="legal">US Legal (8.5 × 14 in)</option>
            </select>
          </div>
          <div class="field">
            <label for="ori-select">{{UI_ORI_LABEL}}</label>
            <select id="ori-select">
              <option value="auto">{{UI_ORI_AUTO}}</option>
              <option value="portrait">{{UI_ORI_PORTRAIT}}</option>
              <option value="landscape">{{UI_ORI_LANDSCAPE}}</option>
            </select>
          </div>
        </div>

        <div class="control-row">
          <div class="field">
            <label for="mode-select">{{UI_MODE_LABEL}}</label>
            <select id="mode-select">
              <option value="sheets-width">{{UI_MODE_SHEETS_W}}</option>
              <option value="sheets-height">{{UI_MODE_SHEETS_H}}</option>
              <option value="size-width">{{UI_MODE_SIZE_W}}</option>
              <option value="size-height">{{UI_MODE_SIZE_H}}</option>
              <option value="scale">{{UI_MODE_SCALE}}</option>
            </select>
          </div>
          <div class="field">
            <label for="units-select">{{UI_UNITS_LABEL}}</label>
            <select id="units-select">
              <option value="cm">Centimeters (cm)</option>
              <option value="mm">Millimeters (mm)</option>
              <option value="in">Inches (in)</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="size-value">{{UI_VALUE_LABEL}}</label>
          <div class="input-with-unit">
            <input id="size-value" type="number" value="3" min="1" max="20000" step="1">
            <span id="size-unit-label" class="unit-tag">sheets</span>
          </div>
        </div>

        <div class="control-row">
          <div class="field">
            <label for="margin-input">{{UI_MARGIN_LABEL}}</label>
            <input id="margin-input" type="number" value="5" min="0" max="40" step="1">
          </div>
          <div class="field">
            <label for="overlap-input">{{UI_OVERLAP_LABEL}}</label>
            <input id="overlap-input" type="number" value="10" min="0" max="60" step="1">
          </div>
        </div>

        <div class="checks-group">
          <label class="check-label">
            <input id="opt-crop-marks" type="checkbox" checked>
            <span>{{UI_OPT_CROP}}</span>
          </label>
          <label class="check-label">
            <input id="opt-tile-labels" type="checkbox" checked>
            <span>{{UI_OPT_LABELS}}</span>
          </label>
          <label class="check-label">
            <input id="opt-assembly-map" type="checkbox" checked>
            <span>{{UI_OPT_MAP}}</span>
          </label>
        </div>

        <div class="summary-box">
          <div class="summary-line">
            <span>{{UI_SUMMARY_SHEETS}}</span>
            <strong id="summary-sheets">—</strong>
          </div>
          <div class="summary-line">
            <span>{{UI_SUMMARY_SIZE}}</span>
            <strong id="summary-size">—</strong>
          </div>
          <div class="summary-line">
            <span>{{UI_SUMMARY_QUALITY}}</span>
            <strong id="summary-dpi">—</strong>
          </div>
        </div>

        <div id="summary-excluded" class="excluded-bar" hidden>
          <span>Some blank/edge tiles skipped</span>
          <button id="btn-reset-excluded" class="btn btn-secondary btn-sm" type="button">Restore</button>
        </div>

        <div id="summary-warnings" class="alert-warn" hidden></div>

        <div class="export-actions">
          <button id="btn-download" class="btn btn-primary" type="button" disabled>{{UI_DOWNLOAD_PDF}}</button>
          <button id="btn-print" class="btn btn-secondary" type="button" disabled>{{UI_PRINT_DIRECT}}</button>
        </div>

        <p id="export-status" class="export-status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>
</section>

<section class="trust-strip" aria-label="Core guarantees">
{{TRUST_CARDS}}
</section>

{{BODY_SECTIONS}}

<section class="content-section">
  <h2>{{UI_FAQ_HEADING}}</h2>
  <div class="faq-list">
{{FAQ_ITEMS}}
  </div>
</section>
