<section class="content-section">
  <h2>Visual Assembly Reference</h2>
  <div class="diagram-grid">
    <figure class="diagram-card">
      <svg viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Diagram 1: Trim top and left margins only">
        <rect x="0" y="0" width="320" height="200" rx="8" fill="#ffffff"/>
        <rect x="30" y="20" width="120" height="160" fill="#ffffff" stroke="#a1a1aa" stroke-width="2"/>
        <rect x="44" y="34" width="92" height="132" fill="#dbeafe"/>
        <line x1="30" y1="34" x2="150" y2="34" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
        <line x1="44" y1="20" x2="44" y2="180" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>
        <text x="52" y="54" font-family="sans-serif" font-size="14" font-weight="bold" fill="#18181b">A2</text>
        <text x="170" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Trim TOP &amp; LEFT</text>
        <text x="170" y="96" font-family="sans-serif" font-size="12" fill="#52525b">Keep RIGHT &amp; BOTTOM</text>
        <text x="170" y="114" font-family="sans-serif" font-size="12" fill="#52525b">overlap tabs intact.</text>
      </svg>
      <figcaption>1. Cut along the TOP and LEFT crop lines on overlapping sheets so the clean edge sits smoothly over the previous sheet's glue tab.</figcaption>
    </figure>

    <figure class="diagram-card">
      <svg viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Diagram 2: Glue tab and crosshair alignment">
        <rect x="0" y="0" width="320" height="200" rx="8" fill="#ffffff"/>
        <rect x="24" y="28" width="128" height="144" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
        <rect x="132" y="28" width="20" height="144" fill="#bfdbfe"/>
        <rect x="132" y="28" width="128" height="144" fill="#dbeafe" fill-opacity="0.72" stroke="#18181b" stroke-width="2"/>
        <line x1="132" y1="20" x2="132" y2="180" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
        <path d="M126 36h12M132 30v12M126 164h12M132 158v12" stroke="#dc2626" stroke-width="2.5"/>
        <text x="36" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#18181b">A1</text>
        <text x="228" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#18181b">A2</text>
        <text x="34" y="106" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Glue tab -&gt;</text>
      </svg>
      <figcaption>2. Run glue stick along A1's dashed right overlap strip, then align A2's trimmed left edge directly onto the (+) crosshairs.</figcaption>
    </figure>

    <figure class="diagram-card">
      <svg viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Diagram 3: Measure 50mm calibration ruler">
        <rect x="0" y="0" width="320" height="200" rx="8" fill="#ffffff"/>
        <rect x="24" y="34" width="272" height="132" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
        <text x="40" y="64" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">PRINT AT 100% / ACTUAL SIZE</text>
        <line x1="44" y1="116" x2="244" y2="116" stroke="#18181b" stroke-width="3"/>
        <line x1="44" y1="98" x2="44" y2="122" stroke="#dc2626" stroke-width="2.5"/>
        <line x1="84" y1="104" x2="84" y2="122" stroke="#18181b" stroke-width="2"/>
        <line x1="124" y1="104" x2="124" y2="122" stroke="#18181b" stroke-width="2"/>
        <line x1="164" y1="104" x2="164" y2="122" stroke="#18181b" stroke-width="2"/>
        <line x1="204" y1="104" x2="204" y2="122" stroke="#18181b" stroke-width="2"/>
        <line x1="244" y1="98" x2="244" y2="122" stroke="#dc2626" stroke-width="2.5"/>
        <text x="40" y="140" font-family="sans-serif" font-size="12" fill="#18181b">0</text>
        <text x="210" y="140" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">50 mm</text>
      </svg>
      <figcaption>3. Before cutting a large pattern or poster, measure the Page 1 calibration ruler to confirm your printer did not shrink pages.</figcaption>
    </figure>
  </div>
  <p><a class="btn btn-primary" href="/">Open Poster Tiler Tool</a></p>
</section>
